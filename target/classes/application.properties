# ── Database ──────────────────────────────────────────────────────────────────
# Start Postgres with Docker:
# docker run --name retry-db -e POSTGRES_PASSWORD=secret -e POSTGRES_DB=retrydb -p 5432:5432 -d postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/retrydb
spring.datasource.username=postgres
spring.datasource.password=secret
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
# "update" means Hibernate reads your @Entity classes and creates/alters the
# table automatically on startup. Never use "create-drop" in production — it
# wipes all data on every restart.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ── Server ────────────────────────────────────────────────────────────────────
server.port=8080

# ── Virtual Threads ───────────────────────────────────────────────────────────
# Enable Java 21 Virtual Threads globally. Every incoming HTTP request and every
# Spring-managed async task gets its own Virtual Thread instead of an OS thread.
# This means the entire app becomes highly concurrent with minimal memory overhead.
spring.threads.virtual.enabled=true

# ── Graceful Shutdown ─────────────────────────────────────────────────────────
# On SIGTERM, Spring stops accepting new requests and waits up to 30s for
# in-flight work to complete before the JVM exits. Without this, active
# Virtual Threads processing tasks are killed mid-execution, leaving rows
# permanently stuck in IN_PROGRESS with no path back to PENDING.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
